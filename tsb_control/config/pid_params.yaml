pid_node:
  ros__parameters:
    use_sim_time: true
    surge:
      kp: 1.2
      ki: 0.1
      kd: 0.05
      kff: 1.0
      integral_limit: 1.0
      max_tau: 0.22
    heading:
      kp: 1.8
      ki: 0.05
      kd: 0.15
      kff: 0.0
      integral_limit: 1.0
      max_tau: 1.5

allocation_node:
  ros__parameters:
    use_sim_time: true
    wheel_separation: 0.16
    max_wheel_speed: 0.22
    max_current: 10.0
    cmd_timeout: 0.5         

sensor_processing_node:
  ros__parameters:
    use_sim_time: true

path_follower_node:
  ros__parameters:
    use_sim_time: true
    rate_hz: 20.0
    lookahead: 0.5          
    acceptance_radius: 0.15   
    cruise_speed: 0.15     
    max_speed: 0.22        
    slow_gain: 1.0    
    start_from_current: true 
